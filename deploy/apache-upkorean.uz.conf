# /www/server/panel/vhost/apache/upkorean.uz.conf — aaPanel's Apache in front of the Node app on 127.0.0.1:3000.
# Written by hand, not through the panel: do not add upkorean.uz as a site in aaPanel, it would clash with this file.

<VirtualHost *:80>
    ServerName upkorean.uz
    ServerAlias www.upkorean.uz
    ErrorLog "/www/wwwlogs/upkorean.uz-error_log"
    CustomLog "/www/wwwlogs/upkorean.uz-access_log" combined

    # Let's Encrypt HTTP challenge (certbot --webroot)
    Alias /.well-known/acme-challenge/ /www/wwwroot/upkorean.uz/.well-known/acme-challenge/
    <Directory "/www/wwwroot/upkorean.uz">
        Require all granted
    </Directory>

    # With a certificate: everything goes to https. Without one yet: serve the app over plain http.
    <IfFile /etc/letsencrypt/live/upkorean.uz/fullchain.pem>
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteRule ^ https://upkorean.uz%{REQUEST_URI} [R=301,L]
    </IfFile>
    <IfFile !/etc/letsencrypt/live/upkorean.uz/fullchain.pem>
        ProxyPreserveHost On
        ProxyPass /.well-known/acme-challenge/ !
        ProxyPass / http://127.0.0.1:3000/
        ProxyPassReverse / http://127.0.0.1:3000/
    </IfFile>
</VirtualHost>

<IfFile /etc/letsencrypt/live/upkorean.uz/fullchain.pem>
<VirtualHost *:443>
    ServerName upkorean.uz
    ServerAlias www.upkorean.uz
    ErrorLog "/www/wwwlogs/upkorean.uz-error_log"
    CustomLog "/www/wwwlogs/upkorean.uz-access_log" combined

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/upkorean.uz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/upkorean.uz/privkey.pem
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1

    # One address for the API, so the app and the reset links in emails always name the same host.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\. [NC]
    RewriteRule ^ https://upkorean.uz%{REQUEST_URI} [R=301,L]

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "https"
    # The API accepts JSON bodies up to 3 MB (progress sync).
    LimitRequestBody 5242880
</VirtualHost>
</IfFile>
