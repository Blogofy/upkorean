  <!-- media="print" keeps this third-party stylesheet out of the critical path: it is fetched at low priority
       and does not hold up the first paint. It is 395 KB of @font-face rules, most of them Noto Sans KR's
       Korean ranges. app.js switches it to media="all" once it has finished downloading; the <noscript> copy
       covers a browser with JavaScript turned off. The inline onload the usual version of this trick uses is
       blocked by this site's CSP (script-src 'self'), which is why the flip lives in app.js. -->
  <link id="font-css" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/css/styles.css?v=__BUILD__">

</head>
<body>
  <main id="app" tabindex="-1">
    <div class="boot" role="status">
      <div class="brand"><span class="mark"></span><span class="name">UpKorean</span></div>
      <span class="boot-copy">Yuklanmoqda…</span>
    </div>
  </main>
  <!-- Announcements for assistive technology. #app used to be the live region, so every render — a route
       change, an answer, a keystroke in the library search — made the whole page be read out again. This one
       is tiny and sits outside #app, whose contents are replaced wholesale; U.say writes into it. -->
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <noscript>UpKorean ishlashi uchun JavaScript yoqilgan bo‘lishi kerak.</noscript>
  <!-- js/vocab.js, js/examples.js and js/roots.js are deliberately missing: 383 KB of course data that the
       sign-in screens never touch. S.loadCorpus() (js/store.js) adds them after sign-in, before the first
       screen that reads a word. ?v= is the build id the server stamps in; the same id names the service
       worker's cache, so these URLs can be cached for a year and still change on every deploy. -->
  <script src="/js/util.js?v=__BUILD__"></script>
  <script src="/js/sync.js?v=__BUILD__"></script>
  <script src="/js/store.js?v=__BUILD__"></script>
  <script src="/js/push.js?v=__BUILD__"></script>
  <script src="/js/exercise.js?v=__BUILD__"></script>
  <script src="/js/views-auth.js?v=__BUILD__"></script>
  <script src="/js/views.js?v=__BUILD__"></script>
  <script src="/js/app.js?v=__BUILD__"></script>
</body>
</html>
